name: Verify Android project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f app/src/main/AndroidManifest.xml
          test -f validate-source.sh
          test -f app/src/main/java/com/vanc/localmusic/ui/screens/TracksScreen.kt
          test -f app/src/main/java/com/vanc/localmusic/ui/screens/AlbumDetailScreen.kt
          test -f app/src/main/java/com/vanc/localmusic/ui/screens/PlaylistDetailScreen.kt
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate source
        run: bash validate-source.sh
      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Lint
        run: gradle --no-daemon --stacktrace :app:lintDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LocalMusicPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
